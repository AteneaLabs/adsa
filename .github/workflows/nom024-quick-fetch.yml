name: NOM-024 quick direct fetch

on:
  push:
    branches: [ops/nom024-official-fetch-20260829]
    paths: [.github/workflows/nom024-quick-fetch.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch direct authority files
        shell: bash
        run: |
          set -u
          OUT=nom024-quick-fetch
          mkdir -p "$OUT/01-procedimiento" "$OUT/02-catalogos/CAT_FORMACION" "$OUT/02-catalogos/CAT_RELIGION" "$OUT/02-catalogos/CSG-CNIS"
          cat > /tmp/files.tsv <<'EOF'
          01-procedimiento/DGIS_NOM-024-PEC_20250605.png	http://www.dgis.salud.gob.mx/images/certificacion/DGIS_NOM-024-PEC_20250605.png
          01-procedimiento/guia_rapida_proceso_de_certificacion.pdf	http://www.dgis.salud.gob.mx/contenidos/intercambio/guias/guia_rapida_proceso_de_certificacion.pdf?v=2025.05.30
          01-procedimiento/LineaTiempo-PEC_20220804.svg	http://www.dgis.salud.gob.mx/images/certificacion/LineaTiempo-PEC_20220804.svg
          02-catalogos/CAT_FORMACION/CMPE_2016.pdf	https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/nueva_estruc/702825086664.pdf
          02-catalogos/CAT_FORMACION/CMPE_2011.pdf	http://www.inegi.org.mx/est/contenidos/espanol/metodologias/clasificadores/CMPE_2011.pdf
          02-catalogos/CAT_RELIGION/Clasificaciones_CPV_2010.pdf	https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/nueva_estruc/702825002067.pdf
          02-catalogos/CAT_RELIGION/Clasificacion_religiones_2010_a.pdf	https://www.inegi.org.mx/contenidos/clasificadoresycatalogos/doc/clasificacion_de_religiones_2010.pdf
          02-catalogos/CAT_RELIGION/Clasificacion_religiones_2010_b.pdf	https://www.inegi.org.mx/contenidos/clasificadoresycatalogos/doc/clasificacion_religiones_2010.pdf
          02-catalogos/CAT_RELIGION/Clasificacion_religiones_2010_c.pdf	https://www.inegi.org.mx/contenidos/programas/ccpv/2010/doc/clasificacion_religiones_2010.pdf
          02-catalogos/CAT_RELIGION/Clasificaciones_CPV_2020.pdf	https://www.inegi.org.mx/contenidos/programas/ccpv/2020/doc/clasificaciones_censo2020.pdf
          02-catalogos/CSG-CNIS/CNIS_base_2025.pdf	https://www.dof.gob.mx/nota_to_pdf.php?fecha=26/04/2025&edicion=MAT
          EOF
          : > "$OUT/fetch-log.tsv"
          while IFS=$'\t' read -r rel url; do
            dst="$OUT/$rel"
            mkdir -p "$(dirname "$dst")"
            tmp="$dst.tmp"
            code=$(curl -k -L --connect-timeout 10 --max-time 35 -sS -w '%{http_code}' -o "$tmp" "$url" || true)
            ctype=$(file -b --mime-type "$tmp" 2>/dev/null || true)
            size=$(stat -c %s "$tmp" 2>/dev/null || echo 0)
            accepted=no
            case "$rel" in
              *.pdf) [ "$ctype" = application/pdf ] && accepted=yes ;;
              *.png) [ "$ctype" = image/png ] && accepted=yes ;;
              *.svg) [[ "$ctype" == image/svg+xml || "$ctype" == text/xml || "$ctype" == text/plain ]] && grep -qi '<svg' "$tmp" && accepted=yes ;;
              *) [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 300 ] 2>/dev/null && accepted=yes ;;
            esac
            if [ "$accepted" = yes ]; then mv "$tmp" "$dst"; else mv "$tmp" "$dst.response" 2>/dev/null || true; fi
            sha=$(sha256sum "$dst" 2>/dev/null | awk '{print $1}' || true)
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$rel" "$url" "$code" "$ctype" "$size" "$accepted" "$sha" >> "$OUT/fetch-log.tsv"
          done < /tmp/files.tsv
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          cat "$OUT/fetch-log.tsv"
      - name: Upload quick bundle
        uses: actions/upload-artifact@v4
        with:
          name: nom024-quick-fetch
          path: nom024-quick-fetch
          if-no-files-found: error
          retention-days: 7
