name: NOM-024 supplemental official-source fetch

on:
  push:
    branches: [ops/nom024-official-fetch-20260829]
    paths: [.github/workflows/nom024-supplemental-fetch.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch supplemental primary sources
        shell: bash
        run: |
          cat > /tmp/supplemental.py <<'PY'
          import csv, hashlib, json, mimetypes, os, re, time
          from collections import deque
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import unquote, urljoin, urlparse, urlunparse
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('nom024-supplemental-fetch'); OUT.mkdir(exist_ok=True)
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 NOM024EvidenceCollector/2.0','Accept':'*/*'})
          OFFICIAL=('salud.gob.mx','gob.mx','inegi.org.mx','csg.gob.mx','dof.gob.mx','segob.gob.mx','ema.org.mx')
          ASSET={'.pdf','.zip','.xlsx','.xls','.csv','.xml','.json','.txt','.doc','.docx','.jar','.jks','.rar','.7z','.dbf','.shp','.shx','.prj','.ods','.rtf'}
          ROOTS=[
            ('01-procedimiento','DGIS-institucional','https://www.gob.mx/salud/acciones-y-programas/direccion-general-de-informacion-en-salud-dgis',2),
            ('01-procedimiento','DGIS-certificacion','http://www.dgis.salud.gob.mx/contenidos/intercambio/certificacion-nom-024-ssa3-2012.html',1),
            ('04-precedentes','DGIS-sires-certificados','http://www.dgis.salud.gob.mx/contenidos/intercambio/sires_certificacion_gobmx.html',2),
            ('02-catalogos/CSG','CNIS-digital','http://www.csg.gob.mx/Compendio/CNIS/cnis.html',2),
            ('02-catalogos/CSG','CNIS-gobmx','https://www.gob.mx/csg/acciones-y-programas/compendio-nacional-de-insumos-para-la-salud',1),
            ('02-catalogos/CSG','CNIS-acuerdos','https://www.gob.mx/csg/articulos/acuerdos-por-el-que-se-actualiza-el-compendio-nacional-de-insumos-para-la-salud',1),
            ('02-catalogos/CSG','ACNIS','https://acnis.csg.gob.mx/',1),
            ('02-catalogos/INEGI','INEGI-clasificaciones','https://www.inegi.org.mx/datos/clasificaciones.html',2),
          ]
          KEYWORDS=('nom-024','cuestionario','verificacion','certificacion','certificado','sires','compendio','cnis','medicamento','material','instrumental','equipo','administracion','clasificacion','religion','formacion','programa','lengua','indigena','catalogo')

          def now(): return datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          def canonical(u):
            p=urlparse(u); return urlunparse((p.scheme,p.netloc,p.path,p.params,p.query,''))
          def official(u):
            h=(urlparse(u).hostname or '').lower(); return any(h==d or h.endswith('.'+d) for d in OFFICIAL)
          def safe(s):
            s=unquote(s).replace('\\','_').replace('/','_').strip(); s=re.sub(r'[^A-Za-z0-9._()\-]+','-',s); return (s.strip('-.') or 'item')[:190]
          def request(u):
            p=urlparse(u); variants=[u,urlunparse((('https' if p.scheme=='http' else 'http'),p.netloc,p.path,p.params,p.query,p.fragment))]
            errs=[]
            for v in dict.fromkeys(variants):
              for verify in (True,False):
                try:
                  r=S.get(v,timeout=120,allow_redirects=True,verify=verify)
                  if r.status_code < 500 or v==variants[-1]: return r
                  errs.append(f'{v} verify={verify}: HTTP {r.status_code}')
                except Exception as e: errs.append(f'{v} verify={verify}: {type(e).__name__}: {e}')
                time.sleep(.25)
            raise RuntimeError(' | '.join(errs))
          def path_for(section,logical,u,ctype):
            n=os.path.basename(urlparse(u).path.rstrip('/'))
            if not n or '.' not in n: n=safe(logical)+(mimetypes.guess_extension((ctype or '').split(';')[0].strip()) or '')
            n=safe(n)
            if 'text/html' in (ctype or '').lower() and not n.lower().endswith(('.html','.htm')): n=safe(logical)+'.html'
            d=OUT/section; d.mkdir(parents=True,exist_ok=True); p=d/n; i=2
            while p.exists(): p=d/f'{Path(n).stem}-{i}{Path(n).suffix}'; i+=1
            return p
          def save(section,logical,u,kind,depth):
            rec={'requested_url':u,'section':section,'logical_name':logical,'kind':kind,'depth':depth,'fetched_at_utc':now()}
            try:
              r=request(u); data=r.content; ctype=r.headers.get('content-type',''); p=path_for(section,logical,r.url,ctype); p.write_bytes(data)
              rec.update({'final_url':r.url,'status':r.status_code,'content_type':ctype,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'saved_path':str(p.relative_to(OUT)),'error':None if r.ok else f'HTTP {r.status_code}'})
              return rec,data,ctype
            except Exception as e:
              rec.update({'final_url':None,'status':None,'content_type':None,'bytes':None,'sha256':None,'saved_path':None,'error':f'{type(e).__name__}: {e}'})
              return rec,None,''
          def should_follow(source_url,absolute,text,depth_left):
            if depth_left<=0 or not official(absolute): return False
            path=urlparse(absolute).path.lower(); ext=Path(path).suffix.lower(); hay=(text+' '+absolute).lower()
            if ext in ASSET: return any(k in hay for k in KEYWORDS) or 'cms/uploads/attachment' in hay or 'contenidos/' in hay
            if '/intercambio/certificados/' in path and path.endswith('.html'): return True
            if any(k in hay for k in KEYWORDS):
              # keep HTML crawling narrowly within primary pages
              host=(urlparse(absolute).hostname or '').lower()
              return host.endswith(('dgis.salud.gob.mx','csg.gob.mx','inegi.org.mx','gob.mx'))
            return False

          q=deque(); seen=set(); records=[]; links=[]
          for section,logical,u,depth in ROOTS: q.append((section,logical,u,'root',depth))
          while q:
            section,logical,u,kind,depth=q.popleft(); key=canonical(u)
            if key in seen: continue
            seen.add(key)
            rec,data,ctype=save(section,logical,u,kind,depth); records.append(rec); print(json.dumps(rec,ensure_ascii=False))
            if data is None or 'text/html' not in ctype.lower() or depth<=0: continue
            soup=BeautifulSoup(data,'html.parser')
            for tag in soup.find_all(['a','link','script','iframe']):
              raw=tag.get('href') if tag.name in ('a','link') else tag.get('src')
              if not raw: continue
              absolute=canonical(urljoin(rec.get('final_url') or u,raw)); text=' '.join(tag.get_text(' ',strip=True).split()) or tag.get('title','') or tag.get('aria-label','')
              links.append({'source_page':rec.get('final_url') or u,'section':section,'anchor_text':text,'url':absolute,'official':official(absolute),'depth_from_source':depth})
              if should_follow(rec.get('final_url') or u,absolute,text,depth):
                target_section=section
                if '/intercambio/certificados/' in urlparse(absolute).path.lower(): target_section='04-precedentes/certificados-vigentes'
                q.append((target_section,text or Path(urlparse(absolute).path).name,absolute,'discovered',depth-1))
          (OUT/'fetch-report.json').write_text(json.dumps({'generated_at_utc':now(),'records':records,'summary':{'requests':len(records),'success_2xx':sum(1 for r in records if isinstance(r.get('status'),int) and 200<=r['status']<300),'failed':sum(1 for r in records if r.get('error')),'links':len(links)}},ensure_ascii=False,indent=2),encoding='utf-8')
          with (OUT/'discovered-links.tsv').open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=['source_page','section','anchor_text','url','official','depth_from_source'],delimiter='\t'); w.writeheader(); w.writerows(links)
          sums=[]
          for p in sorted(x for x in OUT.rglob('*') if x.is_file() and x.name!='SHA256SUMS'):
            sums.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(OUT)}')
          (OUT/'SHA256SUMS').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          PY
          python /tmp/supplemental.py
      - name: Upload supplemental bundle
        uses: actions/upload-artifact@v4
        with:
          name: nom024-supplemental-fetch
          path: nom024-supplemental-fetch
          if-no-files-found: error
          retention-days: 7
